<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЛР 03 — сеанс</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 920px; margin: 24px auto; padding: 0 16px; color: #1b1f23; }
  h1 { margin-bottom: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  fieldset { border: 1px solid #c8d1dc; border-radius: 8px; padding: 12px 16px; }
  legend { font-weight: 600; }
  label { display: block; margin: 6px 0; font-size: 14px; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-top: 2px; }
  button { margin-top: 8px; margin-right: 6px; padding: 6px 12px; cursor: pointer; }
  #state { display: inline-block; padding: 4px 10px; border-radius: 12px; font-weight: 600; background: #e6e9ee; }
  #state[data-state="signed-in"] { background: #d4f2dc; color: #14532d; }
  #state[data-state="anonymous"] { background: #fde2e2; color: #7f1d1d; }
  #state[data-state="unknown"] { background: #fff3cd; color: #664d03; }
  pre { background: #f3f5f8; padding: 10px; border-radius: 6px; white-space: pre-wrap; min-height: 2.5em; }
  dl { margin: 6px 0; display: grid; grid-template-columns: 9em 1fr; gap: 2px 8px; }
  dt { color: #55606e; }
  dd { margin: 0; overflow-wrap: anywhere; }
  fieldset { min-width: 0; }
</style>
</head>
<body>
<h1>Навчальний сеанс (ЛР 03)</h1>
<p>Стан сеансу: <span id="state" data-state="unknown">невідомо</span></p>

<div class="grid">
  <fieldset>
    <legend>1. Реєстрація</legend>
    <form id="register">
      <label>Ім’я користувача <input name="userName" autocomplete="username" required maxlength="64"></label>
      <label>Email <input name="email" type="email" autocomplete="email" required maxlength="256"></label>
      <label>Відображуване ім’я <input name="displayName" required maxlength="120"></label>
      <label>Пароль <input name="password" type="password" autocomplete="new-password" required maxlength="128"></label>
      <button>Зареєструватися</button>
    </form>
  </fieldset>

  <fieldset>
    <legend>2. Вхід</legend>
    <form id="login">
      <label>Ім’я <input name="userName" autocomplete="username" required></label>
      <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
      <button>Увійти</button>
    </form>
    <button id="me" type="button">Мій профіль</button>
    <button id="logout" type="button">Вийти</button>
    <dl id="profile"></dl>
  </fieldset>

  <fieldset>
    <legend>3. Новий інцидент</legend>
    <form id="incident">
      <label>Заголовок <input name="title" required maxlength="160"></label>
      <label>Опис <textarea name="description" rows="3" required maxlength="4000"></textarea></label>
      <label>Критичність
        <select name="severity"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select>
      </label>
      <label>Час події <input name="occurredAtUtc" type="datetime-local" required></label>
      <button>Створити</button>
    </form>
  </fieldset>
</div>

<h2>Результат</h2>
<pre id="result"></pre>
<script src="auth-lab.js" defer></script>
</body>
</html>
